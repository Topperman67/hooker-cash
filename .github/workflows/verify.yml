name: Verify Quant Pad
on:
  push:
    branches: [main, quantpad]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run format:check
      - run: npm run build
      # Vercel bundles only the files @vercel/nft traces from the function entry; a dependency it
      # cannot see is missing in production and every /api request fails.
      - name: Check the Vercel function bundle includes its dependencies
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund @vercel/nft@1.10.0
          node --input-type=module -e "
            import { nodeFileTrace } from '@vercel/nft'
            const { fileList } = await nodeFileTrace(['api/[[...path]].js'], { base: process.cwd(), mixedModules: true })
            const files = [...fileList]
            for (const dep of ['@meteora-ag/dynamic-bonding-curve-sdk', '@meteora-ag/cp-amm-sdk', '@noble/hashes', '@solana/web3.js'])
              if (!files.some((f) => f.startsWith('node_modules/' + dep + '/'))) throw new Error(dep + ' is missing from the traced function bundle')
            console.log(files.length + ' files traced')
          "
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Save browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-diagnostics
          path: |
            test-results
            playwright-report
          retention-days: 7
