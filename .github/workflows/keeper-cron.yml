# Runs one keeper pass every 5 minutes: the $QUANTP payout engine (at most once an hour), then the
# Quantum Hooks keeper (harvest + pulse, burns, Fusion, Entanglement epochs, and migrating full
# curves to DAMM v2). Vercel's Hobby plan only allows daily crons, so GitHub's scheduler calls the
# production endpoint instead. Needs the CRON_SECRET repository secret (Settings → Secrets and
# variables → Actions), equal to CRON_SECRET in Vercel. Set the QUANTPAD_URL repository variable to
# use another domain. GitHub may start scheduled runs late, or skip them: on a quiet repository they
# can be hours apart, so an engine that must run hourly needs another scheduler calling the same
# URL with the same header too (the engine never runs more than once an hour).
#
# Each run prints the HTTP status and the response. A status other than 200 fails the run with an
# error annotation; a step that failed inside the tick (it still answers 200) is a warning; what the
# payout engine did is a notice. Annotations show on the run's summary page.
name: Keeper tick

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keeper-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run one keeper pass
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          URL: ${{ vars.QUANTPAD_URL || 'https://quant-pad.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Add the CRON_SECRET repository secret (the same value as CRON_SECRET in Vercel)."
            exit 1
          fi
          code=$(curl -sS --retry 2 --retry-delay 5 --max-time 90 -o body.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" "$URL/api/keeper/tick") || {
            echo "::error::Could not reach $URL/api/keeper/tick"
            exit 1
          }
          echo "HTTP $code from $URL/api/keeper/tick"
          head -c 6000 body.json
          echo
          # annotation text: one line, with % and line breaks escaped
          clean='def clean: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");'
          if [ "$code" != "200" ]; then
            error=$(jq -r "$clean"' .error // "no error message" | clean' body.json 2>/dev/null || echo "unreadable response")
            hint=""
            if [ "$code" = "401" ]; then
              hint=" Check that the CRON_SECRET repository secret equals CRON_SECRET in Vercel."
            fi
            echo "::error::Keeper tick answered HTTP $code: $error.$hint"
            exit 1
          fi
          jq -r "$clean"'
            to_entries[]
            | select((.value | type) == "object" and .value.error != null)
            | "::warning::\(.key) failed: \(.value.error | clean)"' body.json
          jq -r "$clean"'
            .engine as $e
            | if $e == null then empty
              elif $e.ran then "::notice::Payout engine ran: \($e.payouts // [] | length) payout transaction(s), buyback \($e.buyback.signature // "none")\(if $e.error then ", stopped: \($e.error | clean)" else "" end)"
              else "::notice::Payout engine did not run: \($e.reason // $e.error // "unknown" | clean)"
              end' body.json
